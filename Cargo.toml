[package]
name = "Chorus"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "A concurrent HTTP(S) and BitTorrent downloader."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
base64 = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
getrandom = "0.4"
reqwest = { version = "0.13.4", features = ["stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.54.1", features = ["test-util"] }
